# SCPN Dense Plasma Focus Core — optional native extension build (maturin)

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "scpn-dense-plasma-focus-native"
version = "0.1.0"
description = "Optional native level-0 physics kernels of SCPN Dense Plasma Focus Core (bit-exact with the pure-Python floor)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"

[tool.maturin]
features = ["python"]
module-name = "scpn_dense_plasma_focus_native"
