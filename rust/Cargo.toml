# SCPN Dense Plasma Focus Core — native level-0 physics kernels

[package]
name = "scpn-dense-plasma-focus-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Native level-0 device-physics kernels of SCPN Dense Plasma Focus Core, bit-exact with the Python floor"
publish = false

[lib]
name = "scpn_dense_plasma_focus_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
# The shared kernel library at the commit pinned in reactor-domain.json
# (kernel_library.source_commit); its vendored logarithm, exponential and
# power are the same series the Python floor evaluates.
scpn-reactor-kernels-rs = { git = "https://github.com/anulum/scpn-reactor-kernels.git", rev = "1abb8ffbae6f2f324693dc5278976c875d5e440b", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
