# SCPN Dense Plasma Focus Core — secrets, dependency, licence, and workflow policy

name: Scheduled security audit

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Secrets, dependencies, licences, workflows
    uses: ./.github/workflows/reusable-security-audit.yml
    permissions:
      contents: read
