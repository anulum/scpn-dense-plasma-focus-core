name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    name: Static analysis and policy
    uses: ./.github/workflows/reusable-static-policy.yml
    permissions:
      contents: read
  tests:
    name: Tests
    uses: ./.github/workflows/reusable-tests.yml
    permissions:
      contents: read
  security-audit:
    name: Dependency and security audit
    uses: ./.github/workflows/reusable-security-audit.yml
    permissions:
      contents: read
  gate:
    name: Required gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-policy, tests, security-audit]
    if: always()
    permissions: {}
    steps:
      - name: Fail closed on any category result
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$RESULTS" != "success success success" ]; then
            echo "gate: category results did not all succeed: $RESULTS"
            exit 1
          fi
